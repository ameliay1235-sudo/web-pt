<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selamat Ulang Tahun 💖</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden;
 background:radial-gradient(circle at 20% 15%,#ffe3ec,transparent 55%),radial-gradient(circle at 85% 85%,#dff5e3,transparent 50%),#fff6f9;
 font-family:Georgia,"Times New Roman",serif;color:#5a2a3c}
.card{position:relative;z-index:2;max-width:900px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
 background:#ffffffd9;border:3px solid #ffc2d4;border-radius:28px;padding:30px 26px;box-shadow:0 16px 50px #d6336c30;animation:in 1.2s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.txt{flex:1 1 320px;text-align:center}
h1{margin:0;font-family:"Brush Script MT","Segoe Script",cursive;font-weight:400;font-size:clamp(40px,8vw,62px);line-height:1.1;
 background:linear-gradient(90deg,#d6336c,#e63946,#2f9e5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.utk{margin:6px 0 16px;font-size:20px;letter-spacing:1px;color:#9a4a63}
.utk b{color:#d6336c}
.w{margin:10px auto;max-width:360px;padding:10px 14px;border-radius:16px;font-size:18px;opacity:0;animation:up .9s ease-out forwards}
.w:nth-of-type(1){background:#e6f7ea;animation-delay:.8s}
.w:nth-of-type(2){background:#fff0f4;animation-delay:1.5s}
.w:nth-of-type(3){background:#e6f7ea;animation-delay:2.2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.love{margin-top:18px;opacity:0;animation:up 1s 3s ease-out forwards}
.love svg{width:78px;height:78px;animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px #e6394666)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.love p{margin:6px 0 0;font-size:21px;color:#c2185b;font-style:italic}
.pic{flex:1 1 320px}.pic svg{width:100%;height:auto;display:block}
.pt{transform-box:fill-box;transform-origin:50% 100%;animation:pop 1.3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.pad{transform-box:fill-box;transform-origin:50% 50%;animation:padin 1.2s ease-out both}
@keyframes padin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.rp{transform-box:fill-box;transform-origin:50% 50%;animation:rip 3.5s ease-out infinite;fill:none;stroke:#fff;stroke-width:2}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.fl{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:fly linear infinite}
@keyframes fly{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}50%{transform:translateY(-55vh) translateX(18px)}100%{transform:translateY(-115vh) translateX(-14px);opacity:0}}
</style>
</head>
<body>
<div class="card">
 <div class="txt">
  <h1>Selamat Ulang Tahun!</h1>
  <div class="utk">untuk <b id="nama"></b> 🎂</div>
  <div class="w">🌿 Semoga sehat selalu</div>
  <div class="w">🌸 Semoga panjang umur</div>
  <div class="w">✨ Semoga hal-hal baik datang untuk kamu</div>
  <div class="love">
   <svg viewBox="0 0 100 100"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b8b"/><stop offset="1" stop-color="#d90429"/></linearGradient></defs>
    <path d="M50,88 C10,58 2,32 22,18 C36,8 48,16 50,28 C52,16 64,8 78,18 C98,32 90,58 50,88Z" fill="url(#hg)"/>
    <path d="M24,28 C30,22 38,22 42,28" stroke="#fff" stroke-opacity=".6" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
   <p>Kami di sini mencintai kamu ❤️</p>
  </div>
 </div>
 <div class="pic"><svg id="art" viewBox="0 0 360 300"></svg></div>
</div>

<script>
/* ====== UBAH NAMA DI SINI ====== */
var NAMA="Kamu";
document.getElementById("nama").textContent=NAMA;

function c(h,s,l){return "hsl("+h+","+s+"%,"+l+"%)"}
var P="M0,0 C-24,-18 -26,-62 0,-84 C26,-62 24,-18 0,0Z";
var HL="M-12,-52 C-4,-62 4,-62 12,-52";
var ROWS=[[[-64,-40,-16,16,40,64],1,0],[[-52,-26,0,26,52],.85,.45],[[-34,-10,10,34],.66,.9]];
function lotus(x,y,sc,h,s,id,d){
 var o='<defs><linearGradient id="l'+id+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+c(h,s,36)+'"/><stop offset=".6" stop-color="'+c(h,s,62)+'"/><stop offset="1" stop-color="'+c(h,s-12,84)+'"/></linearGradient></defs>';
 o+='<g transform="translate('+x+','+y+') scale('+sc+')">';
 ROWS.forEach(function(r){
  r[0].forEach(function(a,i){
   o+='<g transform="rotate('+a+') scale('+r[1]+')"><g class="pt" style="animation-delay:'+(d+r[2]+i*.08).toFixed(2)+'s"><path d="'+P+'" fill="url(#l'+id+')" stroke="'+c(h,s,30)+'" stroke-opacity=".4" stroke-width="1.2"/><path d="'+HL+'" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/></g></g>';
  });
 });
 return o+'</g>';
}
function pad(x,y,rx,ry,d){
 return '<g class="pad" style="animation-delay:'+d+'s"><ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="url(#gp)" stroke="#1f7a43" stroke-opacity=".5"/><path d="M'+x+','+y+' L'+(x+rx*.95)+','+(y-ry*.25)+'" stroke="#e3f4ea" stroke-width="2.5" stroke-opacity=".8"/><path d="M'+(x-rx*.5)+','+(y-ry*.1)+' Q'+x+','+(y+ry*.4)+' '+(x+rx*.4)+','+(y+ry*.1)+'" stroke="#1f7a43" stroke-opacity=".25" fill="none"/></g>';
}
var s='<defs><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fae6a"/><stop offset="1" stop-color="#1f7a43"/></linearGradient>'
 +'<linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ecf0"/><stop offset="1" stop-color="#8fd0c8"/></linearGradient></defs>'
 +'<ellipse cx="180" cy="248" rx="172" ry="46" fill="url(#wt)" opacity=".85"/>'
 +'<ellipse class="rp" cx="180" cy="248" rx="120" ry="30"/><ellipse class="rp" style="animation-delay:1.7s" cx="180" cy="248" rx="120" ry="30"/>'
 +pad(62,248,50,16,.2)+pad(300,252,46,15,.4)+pad(185,276,58,15,.6)
 +lotus(78,244,.62,352,78,"r",1.4)      /* teratai merah */
 +lotus(290,246,.55,330,70,"b",1.8)     /* teratai pink muda */
 +lotus(182,252,1.15,334,80,"p",1);     /* teratai pink utama */
document.getElementById("art").innerHTML=s;

/* hati melayang */
var cols=["#e63946","#ff5d8f","#ff8fab","#d90429","#ff6b6b"];
for(var i=0;i<22;i++){
 var e=document.createElement("div");
 e.className="fl";e.textContent="❤";
 e.style.left=Math.random()*100+"%";
 e.style.fontSize=(12+Math.random()*24)+"px";
 e.style.color=cols[Math.floor(Math.random()*cols.length)];
 e.style.animationDuration=(9+Math.random()*9)+"s";
 e.style.animationDelay=(-Math.random()*14)+"s";
 document.body.appendChild(e);
}
</script>
</body>
</html>
